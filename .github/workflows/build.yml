name: App EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  # SECRETS REQUIRED (add to repo settings):
  # - EXPO_TOKEN: EAS token for building (get from https://expo.dev/settings/tokens)

  build:
    name: EAS Build (${{ github.event.inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    environment:
      name: ${{ github.event.inputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Expo CLI
        run: npm install -g eas-cli

      - name: Build with EAS (${{ github.event.inputs.profile }})
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform all \
            --profile ${{ github.event.inputs.profile }} \
            --wait

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build-logs
          path: .eas/
          retention-days: 7

      - name: Notify build completion
        if: always()
        run: echo "EAS build completed for profile: ${{ github.event.inputs.profile }}"
